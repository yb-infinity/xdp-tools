name: Build Amazon Linux 2023 RPM

on:
  push:
    branches: [main, amzn2023]
  pull_request:
    branches: [main, amzn2023]

jobs:
  build-rpm:
    strategy:
      matrix:
        include:
          - runner: [self-hosted, Linux, X64, dmz]
            arch: x86_64
          - runner: [self-hosted, Linux, ARM64, dmz]
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Amazon Linux 2023 container
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace amazonlinux:2023 /bin/bash -c "
            # Install dependencies quietly
            echo \"Installing dependencies...\"
            dnf update -y -q
            dnf install -y -q \
              git \
              rpm-build \
              rpmdevtools \
              make \
              gcc \
              clang \
              llvm \
              llvm-devel \
              kernel-devel \
              kernel-headers \
              libbpf \
              libbpf-devel \
              libbpf-static \
              elfutils-libelf-devel \
              elfutils-devel \
              zlib-devel \
              libpcap-devel \
              pkgconfig \
              m4 \
              bpftool \
              tar \
              gzip \
              which \
              findutils
            echo \"Dependencies installed successfully.\"

            # Verify clang installation and set environment
            export CLANG=\$(which clang)
            export LLVM_STRIP=\$(which llvm-strip)
            echo \"Using clang: \$CLANG\"
            echo \"Using llvm-strip: \$LLVM_STRIP\"

            # Verify libbpf installation
            echo \"=== Checking libbpf installation ===\"
            dnf list installed | grep libbpf || echo \"No libbpf packages found\"

            pkg-config --exists libbpf && echo \"libbpf pkg-config: FOUND\" || echo \"libbpf pkg-config: NOT FOUND\"
            pkg-config --modversion libbpf 2>/dev/null && echo \"libbpf version: \$(pkg-config --modversion libbpf)\" || echo \"Failed to get libbpf version\"
            pkg-config --libs libbpf 2>/dev/null && echo \"libbpf libs: \$(pkg-config --libs libbpf)\" || echo \"Failed to get libbpf libs\"
            pkg-config --cflags libbpf 2>/dev/null && echo \"libbpf cflags: \$(pkg-config --cflags libbpf)\" || echo \"Failed to get libbpf cflags\"

            echo \"=== Checking dynamic libraries ===\"
            ldconfig -p | grep -E \"libbpf|libelf|libz\" || echo \"Required libraries not in ldconfig\"

            echo \"=== Checking static libraries ===\"
            find /usr -name \"libbpf.a\" 2>/dev/null && echo \"Static libbpf found\" || echo \"Static libbpf not found\"
            find /usr -name \"libelf.a\" 2>/dev/null && echo \"Static libelf found\" || echo \"Static libelf not found\"

            echo \"=== Testing compilation ===\"
            echo \"#include <bpf/libbpf.h>\" > test.c
            echo \"int main() { return 0; }\" >> test.c
            gcc test.c -lbpf -lelf -lz && echo \"libbpf compilation test: PASSED\" || echo \"libbpf compilation test: FAILED\"
            rm -f test.c a.out

            # Setup RPM build environment
            rpmdev-setuptree

            # Create source archive
            ./mkarchive.sh

            # Copy source archive to SOURCES
            cp *.tar.gz ~/rpmbuild/SOURCES/

            # Copy spec file
            cp packaging/rpm/xdp-tools.spec ~/rpmbuild/SPECS/

            # Patch spec file to disable emacs and wireshark dependencies
            echo \"Patching spec file...\"
            sed -i 's/^BuildRequires:    emacs-nox/# BuildRequires:    emacs-nox/' ~/rpmbuild/SPECS/xdp-tools.spec
            sed -i 's/^BuildRequires:    wireshark-cli/# BuildRequires:    wireshark-cli/' ~/rpmbuild/SPECS/xdp-tools.spec
            sed -i '/^export FORCE_EMACS=1/c\\export FORCE_EMACS=0' ~/rpmbuild/SPECS/xdp-tools.spec
            sed -i '/^export FORCE_SYSTEM_LIBBPF=1/c\\export FORCE_SYSTEM_LIBBPF=0' ~/rpmbuild/SPECS/xdp-tools.spec
            echo \"Spec file patched successfully.\"

            # Set build environment variables
            export FORCE_EMACS=0
            export FORCE_SYSTEM_LIBBPF=0
            echo \"Build environment: FORCE_EMACS=0, FORCE_SYSTEM_LIBBPF=0\"

            # Build RPM
            cd ~/rpmbuild/SPECS
            rpmbuild -ba xdp-tools.spec

            # Copy built packages to workspace (only if they exist)
            mkdir -p /workspace/rpmbuild-output/RPMS
            mkdir -p /workspace/rpmbuild-output/SRPMS

            # Check and copy RPMS
            if [ -d ~/rpmbuild/RPMS ] && [ \"\$(ls -A ~/rpmbuild/RPMS 2>/dev/null)\" ]; then
              cp -r ~/rpmbuild/RPMS/* /workspace/rpmbuild-output/RPMS/
              echo \"RPMS copied successfully\"
            else
              echo \"ERROR: No RPMS found - build failed\"
              exit 1
            fi

            # Check and copy SRPMS
            if [ -d ~/rpmbuild/SRPMS ] && [ \"\$(ls -A ~/rpmbuild/SRPMS 2>/dev/null)\" ]; then
              cp ~/rpmbuild/SRPMS/* /workspace/rpmbuild-output/SRPMS/
              echo \"SRPMS copied successfully\"
            else
              echo \"ERROR: No SRPMS found - build failed\"
              exit 1
            fi
          "

      - name: List built packages
        run: |
          find rpmbuild-output -name "*.rpm" -type f

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amzn2023-rpm-packages-${{ matrix.arch }}
          path: |
            rpmbuild-output/RPMS/**/*.rpm
            rpmbuild-output/SRPMS/*.rpm
          retention-days: 30
